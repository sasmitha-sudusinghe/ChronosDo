<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronosDo - Task Tracker</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0a0a12',
                            800: '#11111f',
                            700: '#18182e',
                            600: '#1e1e38',
                            500: '#252545',
                            border: '#2e2e52',
                            muted: '#6b6b9a'
                        },
                        violet: {
                            DEFAULT: '#7c6aff',
                            light:   '#a89dff',
                            dim:     '#2a2456',
                            glow:    'rgba(124,106,255,0.25)'
                        },
                        cyan: {
                            acc: '#22d3ee',
                            dim: '#0e3a45'
                        },
                        emerald: {
                            acc: '#34d399',
                            dim: '#0d3325'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        glow:   '0 0 20px rgba(124,106,255,0.35)',
                        'glow-sm': '0 0 10px rgba(124,106,255,0.2)',
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body id="appBody" class="min-h-screen flex flex-col font-sans">

    <!-- GLOBAL QUOTE BANNER -->
    <div id="quoteBanner" class="quote-banner w-full text-center font-mono font-semibold tracking-widest uppercase z-50">
        LOADING DISCIPLINE...
    </div>

    <!-- THEME TOGGLE -->
    <button id="themeToggle" class="theme-toggle" title="Toggle theme">🌙</button>


    <!-- MAIN CONTAINER -->
    <div class="max-w-[1440px] w-full mx-auto p-4 sm:p-6 lg:p-8 flex-1">

        <!-- ================= TASK TRACKER ================= -->
        <div id="taskView" class="w-full animate-fade-in">
            <div class="glass-card p-6 flex flex-col gap-5">

                <!-- Top Row -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 h-36">

                    <!-- Title / Clock / Week Nav -->
                    <div class="lg:col-span-3 accent-card p-4 flex flex-col justify-center items-center gap-1 rounded-xl">
                        <div class="text-[10px] font-semibold tracking-[0.25em] uppercase text-violet-light/70 mb-0.5">ChronosDo</div>
                        <h1 class="text-lg font-extrabold tracking-widest uppercase text-white leading-none">TASK TRACKER</h1>
                        <div id="tkLiveClock" class="font-mono text-2xl font-bold text-violet-light tracking-widest mt-1"></div>
                        <div id="tkLiveDate" class="text-[10px] font-medium text-dark-muted uppercase tracking-wider"></div>
                        <div class="flex items-center gap-3 mt-1">
                            <button id="tkPrevWeek" class="nav-btn">‹</button>
                            <div class="text-[11px] font-semibold text-slate-300" id="tkWeekLabel">Week</div>
                            <button id="tkNextWeek" class="nav-btn">›</button>
                        </div>
                    </div>

                    <!-- Weekly Chart -->
                    <div class="lg:col-span-6 glass-inner p-3 rounded-xl flex flex-col overflow-hidden">
                        <div class="text-[10px] font-bold text-center text-dark-muted uppercase tracking-widest mb-1">Weekly Productivity</div>
                        <div class="flex-1 relative w-full min-h-0">
                            <canvas id="tkWeeklyChart"></canvas>
                        </div>
                    </div>

                    <!-- Weekly Rate -->
                    <div class="lg:col-span-3 glass-inner p-4 rounded-xl flex flex-col justify-center items-center relative overflow-hidden">
                        <div class="text-[10px] font-bold uppercase tracking-widest text-dark-muted mb-2">Productivity Rate</div>
                        <div class="text-5xl font-extrabold text-violet-light" id="tkWeeklyRateText">0%</div>
                        <div class="w-full h-1.5 bg-dark-600 mt-3 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-violet to-cyan-acc rounded-full transition-all duration-700" id="tkWeeklyRateBar" style="width:0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Day Columns -->
                <div id="tkColumnsContainer" class="grid grid-cols-1 md:grid-cols-7 gap-3"></div>

                <!-- Rings -->
                <div class="grid grid-cols-1 md:grid-cols-7 gap-2 border-t border-dark-border pt-4" id="tkRingsContainer"></div>

                <!-- Reflection -->
                <div class="glass-inner rounded-xl overflow-hidden">
                    <div class="px-4 py-2 border-b border-dark-border text-[10px] font-bold uppercase tracking-widest text-dark-muted">Weekly Reflection</div>
                    <div class="p-3">
                        <textarea id="tkReflection" class="w-full h-20 outline-none resize-none bg-transparent text-sm text-slate-300 placeholder-dark-muted" placeholder="Write your weekly reflection here..."></textarea>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
