<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronosDo - Task Tracker</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        green: {
                            bg: '#d2dfd2',
                            card: '#ffffff',
                            border: '#78a678',
                            header: '#8bbd8b',
                            text: '#3b5a3b',
                            light: '#e8f0e8'
                        }
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body id="appBody" class="bg-green-bg text-green-text transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <!-- GLOBAL QUOTE BANNER -->
    <div id="quoteBanner" class="w-full bg-[#1a1a1a] text-[#f0f0f0] text-center py-2 font-mono font-bold tracking-widest uppercase text-sm shadow-md z-50">
        LOADING DISCIPLINE...
    </div>

    <!-- MAIN CONTAINER -->
    <div class="max-w-[1400px] w-full mx-auto p-4 sm:p-6 lg:p-8 flex-1">
        
        <!-- ================= TASK TRACKER VIEW (GREEN) ================= -->
        <div id="taskView" class="w-full animate-fade-in">
            <div class="bg-white p-6 shadow-2xl border-4 border-green-border rounded-lg flex flex-col gap-4">
                
                <!-- Top Row -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 h-36">
                    <!-- Title/Meta + Clock + Week Nav -->
                    <div class="lg:col-span-3 border-2 border-green-border p-3 flex flex-col justify-center items-center bg-green-header text-white rounded gap-1">
                        <h1 class="text-xl font-bold tracking-widest uppercase">TASK TRACKER</h1>
                        <div id="tkLiveClock" class="font-mono text-2xl font-bold tracking-widest"></div>
                        <div id="tkLiveDate" class="text-xs font-medium opacity-90 uppercase tracking-wide"></div>
                        <div class="flex items-center gap-2 mt-1">
                            <button id="tkPrevWeek" class="w-6 h-6 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/40 transition-colors font-bold text-sm">‹</button>
                            <div class="text-xs font-semibold" id="tkWeekLabel">Week</div>
                            <button id="tkNextWeek" class="w-6 h-6 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/40 transition-colors font-bold text-sm">›</button>
                        </div>
                    </div>

                    <!-- Weekly Chart -->
                    <div class="lg:col-span-6 border-2 border-green-border p-2 relative rounded flex flex-col overflow-hidden">
                        <div class="text-xs font-bold text-center text-green-text uppercase bg-green-light rounded py-1 mb-1">Weekly Productivity</div>
                        <div class="flex-1 relative w-full min-h-0">
                            <canvas id="tkWeeklyChart"></canvas>
                        </div>
                    </div>

                    <!-- Weekly Stats -->
                    <div class="lg:col-span-3 border-2 border-green-border p-3 rounded flex flex-col justify-center items-center bg-green-light text-green-text relative">
                        <div class="text-xs font-bold uppercase w-full text-center bg-green-header text-white absolute top-0 left-0 py-1 rounded-t">Weekly Productivity Rate</div>
                        <div class="text-4xl font-bold mt-4" id="tkWeeklyRateText">0%</div>
                        <div class="w-full h-2 bg-green-200 mt-2 rounded-full overflow-hidden">
                            <div class="h-full bg-green-500" id="tkWeeklyRateBar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Middle Columns (7 Days) -->
                <div class="grid grid-cols-1 md:grid-cols-7 gap-2">
                    <div id="tkColumnsContainer" class="col-span-1 md:col-span-7 grid grid-cols-1 md:grid-cols-7 gap-2"></div>
                </div>

                <!-- Bottom Rings (7 Days) -->
                <div class="grid grid-cols-1 md:grid-cols-7 gap-2 border-t-2 border-green-border pt-4" id="tkRingsContainer">
                    <!-- Rings Injected by JS -->
                </div>

                <!-- Bottom Text Box -->
                <div class="border-2 border-green-border rounded mt-2">
                    <div class="bg-green-header text-white text-xs font-bold uppercase text-center py-1">Weekly Reflection</div>
                    <div class="p-3 text-sm text-green-text">
                        <textarea id="tkReflection" class="w-full h-20 outline-none resize-none bg-transparent" placeholder="Write your weekly reflection here..."></textarea>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
